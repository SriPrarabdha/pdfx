name: Build & Release pdfx

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - os: linux
            goos: linux
            goarch: amd64
            output: pdfx-linux-amd64

          - os: darwin
            goos: darwin
            goarch: amd64
            output: pdfx-darwin-amd64

          - os: darwin
            goos: darwin
            goarch: arm64
            output: pdfx-darwin-arm64

          - os: windows
            goos: windows
            goarch: amd64
            output: pdfx-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w" -o ${{ matrix.output }}

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.output }}
